<!doctype html>
<meta charset="utf-8">
<title>hara</title>
<link rel="stylesheet" href="../vendor/studio/studio.css">
<link rel="stylesheet" href="../vendor/ui/tokens.css">
<link rel="stylesheet" href="../vendor/ui/components.css">
<link rel="stylesheet" href="./panel.css">
<body>
  <div id="toolbar">
    <button id="kernel-refresh" type="button">refresh kernels</button>
    <label class="toolbar-field">target
      <select id="kernel-target" aria-label="Hara kernel target"></select>
    </label>
    <span id="kernel-status">scanning page…</span>
    <span class="toolbar-spacer"></span>
    <input id="resp-url" type="url" value="ws://127.0.0.1:7356" aria-label="RESP bridge WebSocket URL">
    <button id="resp-connect" type="button">connect RESP</button>
    <span id="resp-status">offline</span>
    <button id="home-button" type="button">choose home</button>
    <span id="home-label">no home</span>
    <button id="run-file-button" type="button">run .hal file</button>
  </div>
  <div id="hara-studio-mount"></div>
  <script type="module" src="./panel.js"></script>
</body>
