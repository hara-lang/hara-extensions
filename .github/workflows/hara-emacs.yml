name: hara-emacs

on:
  push:
    paths:
      - hara-emacs/**
      - .github/workflows/hara-emacs.yml
  pull_request:
    paths:
      - hara-emacs/**
      - .github/workflows/hara-emacs.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y emacs-nox
      - name: Run package and install tests
        run: make -C hara-emacs test
      - name: Byte-compile package
        run: make -C hara-emacs compile
      - name: Clean generated bytecode
        run: make -C hara-emacs clean
