name: db.postgres provider

on:
  push:
    branches: [main]
    paths:
      - "hara-runtime/Cargo.toml"
      - "hara-runtime/Cargo.lock"
      - "hara-runtime/modules/db-postgres/**"
      - ".github/workflows/db-postgres.yml"
  pull_request:
    branches: [main]
    paths:
      - "hara-runtime/Cargo.toml"
      - "hara-runtime/Cargo.lock"
      - "hara-runtime/modules/db-postgres/**"
      - ".github/workflows/db-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out the Hara ABI source tree used by runtime builds
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: 6c14b353920a7d379af60a85938a7231528eeeb1
          path: technology/hara
          fetch-depth: 1
      - name: Expose and verify the extension workspace's sibling Hara layout
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../technology"
          rm -rf "$GITHUB_WORKSPACE/../technology/hara"
          ln -s "$GITHUB_WORKSPACE/technology/hara" "$GITHUB_WORKSPACE/../technology/hara"
          test -f "$GITHUB_WORKSPACE/technology/hara/core/rust/abi/Cargo.toml"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check PostgreSQL provider formatting
        run: cargo fmt --manifest-path hara-runtime/Cargo.toml --package hara-db-postgres -- --check
      - name: Test the PostgreSQL provider against the workspace Hara ABI
        run: cargo test --locked --manifest-path hara-runtime/Cargo.toml -p hara-db-postgres
      - name: Check the extension workspace against the same ABI
        run: cargo check --locked --manifest-path hara-runtime/Cargo.toml --workspace
