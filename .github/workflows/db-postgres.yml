name: db.postgres provider

on:
  push:
    branches:
      - main
      - agent/9-decimal-free-postgres-bootstrap
    paths:
      - "hara-runtime/Cargo.toml"
      - "hara-runtime/Cargo.lock"
      - "hara-runtime/modules/db-postgres/**"
      - ".github/agent-9-bootstrap.py"
      - ".github/workflows/db-postgres.yml"
  pull_request:
    branches: [main]
    paths:
      - "hara-runtime/Cargo.toml"
      - "hara-runtime/Cargo.lock"
      - "hara-runtime/modules/db-postgres/**"
      - ".github/workflows/db-postgres.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: db-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    if: github.ref == 'refs/heads/main' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assemble the Decimal-free provider branch
        if: github.ref == 'refs/heads/agent/9-decimal-free-postgres-bootstrap'
        run: python3 .github/agent-9-bootstrap.py

      - name: Read the PostgreSQL provider's pinned Hara ABI revision
        id: hara-abi
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import tomllib
          from pathlib import Path

          manifest = Path("hara-runtime/modules/db-postgres/Cargo.toml")
          data = tomllib.loads(manifest.read_text())
          dependency = data["dependencies"]["hara-abi"]
          commit = dependency.get("rev") if isinstance(dependency, dict) else None
          if not isinstance(commit, str) or not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("hara-abi must be pinned to an exact 40-character revision")
          print(f"commit={commit}")
          PY

      - name: Check out the exact Hara ABI source tree
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: ${{ steps.hara-abi.outputs.commit }}
          path: technology/hara
          fetch-depth: 1

      - name: Expose and verify the extension workspace's sibling Hara layout
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../technology"
          rm -rf "$GITHUB_WORKSPACE/../technology/hara"
          ln -s "$GITHUB_WORKSPACE/technology/hara" "$GITHUB_WORKSPACE/../technology/hara"
          test "$(git -C "$GITHUB_WORKSPACE/technology/hara" rev-parse HEAD)" = \
            "${{ steps.hara-abi.outputs.commit }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Refresh the Decimal-free ABI lock on the assembly branch
        if: github.ref == 'refs/heads/agent/9-decimal-free-postgres-bootstrap'
        run: |
          ! git grep -n 'Value::Decimal' -- hara-runtime/modules/db-postgres
          cargo fmt --manifest-path hara-runtime/Cargo.toml --package hara-db-postgres
          cargo update --manifest-path hara-runtime/Cargo.toml -p hara-abi
          git diff --check

      - name: Check PostgreSQL provider formatting
        run: cargo fmt --manifest-path hara-runtime/Cargo.toml --package hara-db-postgres -- --check

      - name: Test the PostgreSQL provider against its pinned Hara ABI
        run: cargo test --locked --manifest-path hara-runtime/Cargo.toml -p hara-db-postgres

      - name: Check the extension workspace against the same ABI
        run: cargo check --locked --manifest-path hara-runtime/Cargo.toml --workspace

      - name: Commit the verified provider update
        if: github.ref == 'refs/heads/agent/9-decimal-free-postgres-bootstrap'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hara-runtime/modules/db-postgres/src/lib.rs \
                  hara-runtime/modules/db-postgres/Cargo.toml \
                  hara-runtime/Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(db.postgres): remove native Decimal ABI use (#9)'
          git push origin HEAD:agent/9-decimal-free-postgres-bootstrap
