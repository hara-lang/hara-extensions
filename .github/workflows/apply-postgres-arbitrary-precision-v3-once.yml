name: Apply PostgreSQL arbitrary precision v3 once

on:
  push:
    branches:
      - agent/postgres-arbitrary-precision-abi
    paths:
      - '.github/workflows/apply-postgres-arbitrary-precision-v3-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'hara-lang/hara-extensions'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/postgres-arbitrary-precision-abi
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply function-boundary migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply_postgres_arbitrary_precision_v3.py')
          text = path.read_text()
          old = '''    end_index = text.find(end, start_index + len(start))
              if end_index < 0:
                  raise SystemExit(f"{label}: end marker not found")
              if text.find(start, start_index + len(start), end_index) >= 0:
                  raise SystemExit(f"{label}: start marker is not unique in section")
              return text[:start_index] + replacement.rstrip() + "\\n\\n" + text[end_index:]
          '''
          new = '''    if not end:
                  return text[:start_index] + replacement.rstrip() + "\\n"
              end_index = text.find(end, start_index + len(start))
              if end_index < 0:
                  raise SystemExit(f"{label}: end marker not found")
              if text.find(start, start_index + len(start), end_index) >= 0:
                  raise SystemExit(f"{label}: start marker is not unique in section")
              return text[:start_index] + replacement.rstrip() + "\\n\\n" + text[end_index:]
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one tail-helper anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 -m py_compile .github/scripts/apply_postgres_arbitrary_precision_v3.py
          python3 .github/scripts/apply_postgres_arbitrary_precision_v3.py
      - name: Format and test the PostgreSQL provider
        run: |
          cargo fmt --manifest-path hara-runtime/Cargo.toml --all
          cargo test --manifest-path hara-runtime/Cargo.toml -p hara-db-postgres
      - name: Check the extension workspace against the exact ABI
        run: cargo check --manifest-path hara-runtime/Cargo.toml --workspace
      - name: Verify the locked provider build
        run: cargo test --locked --manifest-path hara-runtime/Cargo.toml -p hara-db-postgres
      - name: Commit the validated migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            hara-runtime/Cargo.lock \
            hara-runtime/modules/std-db-postgres/Cargo.toml \
            hara-runtime/modules/std-db-postgres/src/lib.rs
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "postgres: support arbitrary-precision ABI numerics"
          git push origin HEAD:agent/postgres-arbitrary-precision-abi
