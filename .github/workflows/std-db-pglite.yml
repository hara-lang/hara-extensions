name: std.db PGlite WASM

on:
  pull_request:
    branches: [main]
    paths:
      - "core/lib/src/std/db.hal"
      - "core/lib/src/std/db/**"
      - "core/lib/test/std/db/**"
      - "core/java/src/test/java/hara/truffle/HaraDbRuntimeTest.java"
      - "core/java/src/test/java/hara/truffle/HaraPgliteProcessExtensionTest.java"
      - "hara-runtime/extensions/std-db-pglite/**"
      - "hara-runtime/web/entries/pglite-*.mjs"
      - "hara-runtime/web/packages/db-pglite/**"
      - "hara-runtime/web/pglite-provider.test.mjs"
      - "hara-runtime/web/vite.pglite-*.config.js"
      - "hara-runtime/web/package-db-provider.mjs"
      - "hara-runtime/web/package-pglite-extension.mjs"
      - "hara-runtime/scripts/build-db-pglite-extension"
      - ".github/workflows/std-db-pglite.yml"
  workflow_dispatch:

concurrency:
  group: std-db-pglite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pglite-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: extensions
      - uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          path: technology/hara
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: extensions/hara-runtime/web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install Hara web build dependencies
        working-directory: extensions/hara-runtime/web
        run: npm ci
      - name: Install pinned PGlite provider
        working-directory: extensions/hara-runtime/extensions/std-db-pglite
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build Node provider
        working-directory: extensions/hara-runtime/web
        run: ./node_modules/.bin/vite build --config vite.pglite-node.config.js
      - name: Build browser provider
        working-directory: extensions/hara-runtime/web
        run: ./node_modules/.bin/vite build --config vite.pglite-browser.config.js
      - name: Execute real PGlite provider test
        working-directory: extensions/hara-runtime/web
        run: node --test pglite-provider.test.mjs
      - name: Assemble extension package
        working-directory: extensions/hara-runtime/web
        run: node package-pglite-extension.mjs
      - name: Execute PGlite and database runtimes through Hara
        run: mvn -f technology/hara/core/java/pom.xml -Ptruffle -Dtest=hara.truffle.HaraDbRuntimeTest,hara.truffle.HaraPgliteProcessExtensionTest test
