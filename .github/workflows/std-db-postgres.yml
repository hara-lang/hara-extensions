name: std.db PostgreSQL provider

on:
  push:
    branches: [main]
    paths:
      - "hara-runtime/Cargo.toml"
      - "hara-runtime/Cargo.lock"
      - "hara-runtime/modules/std-db-postgres/**"
      - ".github/workflows/std-db-postgres.yml"
  pull_request:
    branches: [main]
    paths:
      - "hara-runtime/Cargo.toml"
      - "hara-runtime/Cargo.lock"
      - "hara-runtime/modules/std-db-postgres/**"
      - ".github/workflows/std-db-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: std-db-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out the exact Hara ABI source tree
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: af4e2856ae2580db9c1337044e6e1dc52bc8c30e
          path: technology/hara
          fetch-depth: 1
      - name: Expose the extension workspace's sibling Hara layout
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../technology"
          rm -rf "$GITHUB_WORKSPACE/../technology/hara"
          ln -s "$GITHUB_WORKSPACE/technology/hara" "$GITHUB_WORKSPACE/../technology/hara"
          test "$(git -C "$GITHUB_WORKSPACE/technology/hara" rev-parse HEAD)" = \
            af4e2856ae2580db9c1337044e6e1dc52bc8c30e
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path hara-runtime/Cargo.toml --all -- --check
      - name: Test the PostgreSQL provider against its pinned Hara ABI
        run: cargo test --locked --manifest-path hara-runtime/Cargo.toml -p hara-db-postgres
      - name: Check the extension workspace against the same ABI
        run: cargo check --locked --manifest-path hara-runtime/Cargo.toml --workspace
