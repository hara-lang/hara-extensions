name: Agent PostgreSQL ABI compatibility patch

on:
  push:
    branches:
      - agent/postgres-hara-abi-git
    paths:
      - .github/workflows/agent-postgres-abi-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/postgres-hara-abi-git
      - name: Reject runtime-only ABI values at the JSON boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("hara-runtime/modules/std-db-postgres/src/lib.rs")
          text = source.read_text()
          old = '''        Value::Bytes(_) => {
              return Err(Error::new(
                  "postgres/type-unsupported",
                  "bytes cannot be JSON",
              ))
          }
      })
          '''
          new = '''        Value::Bytes(_) => {
              return Err(Error::new(
                  "postgres/type-unsupported",
                  "bytes cannot be JSON",
              ))
          }
          _ => {
              return Err(Error::new(
                  "postgres/type-unsupported",
                  "runtime-only values cannot be JSON",
              ))
          }
      })
          '''
          if old not in text:
              raise SystemExit("expected abi_json match was not found")
          source.write_text(text.replace(old, new, 1))
          Path(".github/workflows/agent-postgres-abi-patch.yml").unlink()
          PY
      - name: Commit compatibility fix
        shell: bash
        run: |
          git config user.name "hara-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "postgres: reject runtime-only ABI JSON values"
          git push origin HEAD:agent/postgres-hara-abi-git
